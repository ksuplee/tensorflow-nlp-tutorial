<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">LLM 에이전트의 구조와 ReAct 루프</text>
  <defs><marker id="a13" markerWidth="13" markerHeight="13" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker></defs>

  <!-- center LLM brain -->
  <circle cx="440" cy="285" r="74" fill="#1e3a8a"/>
  <text x="440" y="280" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">LLM</text>
  <text x="440" y="305" font-size="13" fill="#c7d2fe" text-anchor="middle">(두뇌·계획)</text>

  <!-- loop nodes -->
  <g text-anchor="middle">
    <rect x="320" y="100" width="240" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="128" font-size="17" font-weight="700" fill="#1e3a8a">① 사고 (Thought)</text>
    <text x="440" y="149" font-size="12" fill="#64748b">목표 분석·다음 행동 계획</text>

    <rect x="660" y="255" width="240" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="780" y="283" font-size="17" font-weight="700" fill="#1e3a8a">② 행동 (Action)</text>
    <text x="780" y="304" font-size="12" fill="#64748b">함수 호출로 도구 실행</text>

    <rect x="320" y="410" width="240" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="438" font-size="17" font-weight="700" fill="#1e3a8a">③ 관찰 (Observation)</text>
    <text x="440" y="459" font-size="12" fill="#64748b">도구 결과 확인·반영</text>
  </g>

  <!-- arrows loop -->
  <path d="M440 162 L440 209" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a13)"/>
  <path d="M502 235 Q620 215 682 275" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a13)"/>
  <path d="M720 317 Q580 420 562 435" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a13)"/>
  <path d="M378 410 Q345 360 388 333" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#a13)"/>
  <text x="795" y="372" font-size="13" fill="#64748b" text-anchor="middle">반복(목표 달성까지)</text>

  <!-- memory (below brain) -->
  <rect x="330" y="235" width="0" height="0"/>
  <rect x="150" y="255" width="150" height="62" rx="12" fill="#fef9c3" stroke="#fde047" stroke-width="2"/>
  <text x="225" y="281" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">메모리</text>
  <text x="225" y="301" font-size="11" fill="#a16207" text-anchor="middle">대화·중간 결과</text>
  <line x1="300" y1="286" x2="364" y2="286" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- tools -->
  <rect x="950" y="120" width="220" height="240" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1060" y="150" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">도구(Tools)</text>
  <g font-size="14" fill="#334155"><text x="975" y="188">🔍 웹·문서 검색</text><text x="975" y="222">🧮 계산기</text><text x="975" y="256">💻 코드 실행</text><text x="975" y="290">🗄 데이터베이스·API</text><text x="975" y="326" font-size="12" fill="#64748b">→ RAG도 도구의 하나</text></g>
  <line x1="900" y1="286" x2="948" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <text x="600" y="474" font-size="0" fill="#fff"> </text>
</svg>
