<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">Word2Vec: CBOW vs Skip-gram</text>
  <text x="600" y="68" font-size="14" fill="#64748b" text-anchor="middle">예문: "The fat cat sat on the mat" (윈도우 크기 2, 중심 단어 = sat)</text>
  <defs><marker id="w7" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- CBOW -->
  <rect x="40" y="90" width="540" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="310" y="120" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">CBOW — 주변으로 중심 예측</text>
  <g font-size="13">
    <rect x="70" y="150" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="115" y="172" fill="#1e3a8a" text-anchor="middle">fat</text>
    <rect x="70" y="192" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="115" y="214" fill="#1e3a8a" text-anchor="middle">cat</text>
    <rect x="70" y="234" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="115" y="256" fill="#1e3a8a" text-anchor="middle">on</text>
    <rect x="70" y="276" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="115" y="298" fill="#1e3a8a" text-anchor="middle">the</text>
  </g>
  <rect x="240" y="205" width="110" height="50" rx="10" fill="#bfdbfe" stroke="#60a5fa"/><text x="295" y="228" font-size="12" fill="#1e3a8a" text-anchor="middle">투사층</text><text x="295" y="245" font-size="11" fill="#64748b" text-anchor="middle">(평균)</text>
  <rect x="420" y="205" width="120" height="50" rx="10" fill="#1e3a8a"/><text x="480" y="228" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">sat</text><text x="480" y="245" font-size="10" fill="#dbeafe" text-anchor="middle">softmax</text>
  <g stroke="#2563eb" stroke-width="1.6" marker-end="url(#w7)"><line x1="160" y1="167" x2="238" y2="215"/><line x1="160" y1="209" x2="238" y2="223"/><line x1="160" y1="251" x2="238" y2="235"/><line x1="160" y1="293" x2="238" y2="243"/><line x1="350" y1="230" x2="416" y2="230"/></g>
  <text x="310" y="345" font-size="13" fill="#64748b" text-anchor="middle">주변 단어(입력) → 중심 단어(출력)</text>
  <text x="310" y="368" font-size="12" fill="#94a3b8" text-anchor="middle">빠름, 작은 데이터에 유리</text>
  <!-- Skip-gram -->
  <rect x="620" y="90" width="540" height="300" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="890" y="120" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">Skip-gram — 중심으로 주변 예측</text>
  <rect x="660" y="205" width="120" height="50" rx="10" fill="#1e3a8a"/><text x="720" y="235" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">sat</text>
  <g font-size="13">
    <rect x="1000" y="150" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="1045" y="172" fill="#1e3a8a" text-anchor="middle">fat</text>
    <rect x="1000" y="192" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="1045" y="214" fill="#1e3a8a" text-anchor="middle">cat</text>
    <rect x="1000" y="234" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="1045" y="256" fill="#1e3a8a" text-anchor="middle">on</text>
    <rect x="1000" y="276" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="1045" y="298" fill="#1e3a8a" text-anchor="middle">the</text>
  </g>
  <rect x="840" y="205" width="110" height="50" rx="10" fill="#bfdbfe" stroke="#60a5fa"/><text x="895" y="235" font-size="12" fill="#1e3a8a" text-anchor="middle">투사층</text>
  <g stroke="#2563eb" stroke-width="1.6" marker-end="url(#w7)"><line x1="780" y1="230" x2="836" y2="230"/><line x1="950" y1="225" x2="998" y2="167"/><line x1="950" y1="228" x2="998" y2="209"/><line x1="950" y1="233" x2="998" y2="251"/><line x1="950" y1="236" x2="998" y2="293"/></g>
  <text x="890" y="345" font-size="13" fill="#64748b" text-anchor="middle">중심 단어(입력) → 주변 단어(출력)</text>
  <text x="890" y="368" font-size="12" fill="#94a3b8" text-anchor="middle">일반적으로 CBOW보다 성능이 좋음</text>
</svg>
