<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">인코더 블록: 서브층과 Add &amp; Norm</text>
  <defs><marker id="en10" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- flow -->
  <rect x="440" y="360" width="320" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="600" y="385" font-size="13" fill="#1e3a8a" text-anchor="middle">입력 (임베딩 + 포지셔널)</text>
  <rect x="440" y="270" width="320" height="60" rx="10" fill="#2563eb"/><text x="600" y="296" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">① 멀티 헤드 셀프 어텐션</text><text x="600" y="316" font-size="11" fill="#dbeafe" text-anchor="middle">단어 간 관계 포착 (Q=K=V)</text>
  <rect x="440" y="210" width="320" height="36" rx="8" fill="#16a34a"/><text x="600" y="233" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Add &amp; Norm (잔차 연결 + 층 정규화)</text>
  <rect x="440" y="120" width="320" height="60" rx="10" fill="#1e3a8a"/><text x="600" y="146" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">② 포지션-와이즈 FFNN</text><text x="600" y="166" font-size="11" fill="#dbeafe" text-anchor="middle">각 위치에 독립적 비선형 변환</text>
  <rect x="440" y="60" width="320" height="36" rx="8" fill="#16a34a"/><text x="600" y="83" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Add &amp; Norm</text>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#en10)">
    <line x1="600" y1="360" x2="600" y2="332"/><line x1="600" y1="270" x2="600" y2="248"/><line x1="600" y1="210" x2="600" y2="182"/><line x1="600" y1="120" x2="600" y2="98"/>
  </g>
  <!-- residual arrows -->
  <path d="M 440 340 C 400 340, 400 228, 438 228" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#en10)"/>
  <path d="M 440 200 C 400 200, 400 78, 438 78" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#en10)"/>
  <text x="360" y="290" font-size="11" fill="#64748b" text-anchor="middle">잔차 연결</text>
  <!-- right notes -->
  <rect x="800" y="120" width="360" height="200" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="980" y="150" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Add &amp; Norm의 역할</text>
  <g font-size="14" fill="#334155">
    <text x="822" y="186"><tspan font-weight="700" fill="#1e3a8a">잔차 연결(Residual)</tspan></text>
    <text x="822" y="210" font-size="13" fill="#64748b">입력을 출력에 더함 → 기울기 소실</text>
    <text x="822" y="230" font-size="13" fill="#64748b">완화, 깊은 신경망 안정 학습</text>
    <text x="822" y="264"><tspan font-weight="700" fill="#1e3a8a">층 정규화(Layer Norm)</tspan></text>
    <text x="822" y="288" font-size="13" fill="#64748b">층 입력 분포 안정화 → 학습 가속</text>
  </g>
  <text x="600" y="30" font-size="0"> </text>
</svg>
