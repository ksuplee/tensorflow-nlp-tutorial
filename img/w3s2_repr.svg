<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="440" fill="#ffffff"/>
  <text x="600" y="42" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">단어·문서 표현 방법의 분류</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- root -->
  <rect x="490" y="66" width="220" height="50" rx="10" fill="#1e3a8a"/>
  <text x="600" y="97" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">단어 표현 방법</text>
  <!-- branches -->
  <line x1="600" y1="116" x2="300" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="600" y1="116" x2="900" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- local -->
  <rect x="150" y="154" width="300" height="56" rx="10" fill="#2563eb"/>
  <text x="300" y="180" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">국소 표현 (Local)</text>
  <text x="300" y="200" font-size="12" fill="#dbeafe" text-anchor="middle">해당 단어 자체만 보고 수치화</text>
  <!-- distributed -->
  <rect x="750" y="154" width="300" height="56" rx="10" fill="#2563eb"/>
  <text x="900" y="180" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">분산 표현 (Distributed)</text>
  <text x="900" y="200" font-size="12" fill="#dbeafe" text-anchor="middle">주변 단어를 함께 보고 수치화</text>
  <!-- local children -->
  <g font-size="14">
    <rect x="120" y="250" width="150" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="195" y="278" font-weight="700" fill="#1e3a8a" text-anchor="middle">원-핫</text><text x="195" y="300" fill="#64748b" text-anchor="middle" font-size="12">희소·의미 없음</text>
    <rect x="285" y="250" width="150" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="360" y="278" font-weight="700" fill="#1e3a8a" text-anchor="middle">DTM / BoW</text><text x="360" y="300" fill="#64748b" text-anchor="middle" font-size="12">빈도 행렬</text>
    <rect x="200" y="330" width="150" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="275" y="358" font-weight="700" fill="#1e3a8a" text-anchor="middle">TF-IDF</text><text x="275" y="380" fill="#64748b" text-anchor="middle" font-size="12">가중 빈도</text>
  </g>
  <line x1="300" y1="210" x2="195" y2="248" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="300" y1="210" x2="360" y2="248" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="300" y1="210" x2="275" y2="328" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ar)"/>
  <!-- distributed children -->
  <g font-size="14">
    <rect x="765" y="250" width="150" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="840" y="278" font-weight="700" fill="#1e3a8a" text-anchor="middle">Word2Vec</text><text x="840" y="300" fill="#64748b" text-anchor="middle" font-size="12">밀집 임베딩</text>
    <rect x="930" y="250" width="150" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1005" y="278" font-weight="700" fill="#1e3a8a" text-anchor="middle">GloVe·FastText</text><text x="1005" y="300" fill="#64748b" text-anchor="middle" font-size="11">(7주차)</text>
    <rect x="845" y="330" width="190" height="66" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="940" y="358" font-weight="700" fill="#1e3a8a" text-anchor="middle">문맥 고려</text><text x="940" y="380" fill="#64748b" text-anchor="middle" font-size="12">ELMo·BERT·GPT</text>
  </g>
  <line x1="900" y1="210" x2="840" y2="248" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="900" y1="210" x2="1005" y2="248" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="900" y1="210" x2="940" y2="328" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ar)"/>
  <text x="600" y="360" font-size="13" fill="#94a3b8" text-anchor="middle">본 주차는</text>
  <text x="600" y="382" font-size="13" fill="#94a3b8" text-anchor="middle">국소 표현(카운트 기반)을</text>
  <text x="600" y="404" font-size="13" fill="#94a3b8" text-anchor="middle">다룬다</text>
</svg>
