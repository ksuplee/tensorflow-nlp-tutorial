<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">포지셔널 인코딩 (Positional Encoding)</text>
  <defs><marker id="pe10" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- word embedding -->
  <rect x="60" y="120" width="200" height="120" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="160" y="150" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">단어 임베딩</text>
  <text x="160" y="178" font-size="12" fill="#64748b" text-anchor="middle">"student"</text>
  <text x="160" y="204" font-size="11" fill="#64748b" text-anchor="middle">순서 정보 없음</text>
  <text x="160" y="228" font-size="11" fill="#94a3b8" text-anchor="middle">(병렬 처리라 위치 모름)</text>
  <text x="300" y="185" font-size="26" fill="#2563eb" text-anchor="middle">+</text>
  <!-- positional -->
  <rect x="340" y="120" width="200" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="440" y="150" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">위치 벡터</text>
  <text x="440" y="178" font-size="12" fill="#64748b" text-anchor="middle">sin / cos 함수로 생성</text>
  <text x="440" y="204" font-size="11" fill="#64748b" text-anchor="middle">위치(pos)·차원(i) 반영</text>
  <text x="440" y="228" font-size="11" fill="#94a3b8" text-anchor="middle">각 위치마다 고유 패턴</text>
  <line x1="560" y1="180" x2="600" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pe10)"/>
  <!-- result -->
  <rect x="620" y="120" width="220" height="120" rx="10" fill="#1e3a8a"/>
  <text x="730" y="152" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">위치 정보를 담은</text>
  <text x="730" y="176" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">입력 벡터</text>
  <text x="730" y="206" font-size="12" fill="#dbeafe" text-anchor="middle">→ 트랜스포머의 입력</text>
  <text x="730" y="228" font-size="11" fill="#93c5fd" text-anchor="middle">단어의 순서를 구별 가능</text>
  <!-- formula -->
  <rect x="880" y="120" width="280" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1020" y="150" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">수식</text>
  <text x="900" y="182" font-size="13" fill="#334155">PE(pos, 2i) = sin(pos/10000^(2i/d))</text>
  <text x="900" y="210" font-size="13" fill="#334155">PE(pos, 2i+1) = cos(pos/10000^(2i/d))</text>
  <text x="600" y="300" font-size="14" fill="#334155" text-anchor="middle">트랜스포머는 순서대로 읽지 않으므로(병렬), 위치 정보를 임베딩에 더해 순서를 알려준다</text>
</svg>
