  <text x="600" y="352" font-size="14" fill="#334155" text-anchor="middle">인코더가 문장을 컨텍스트 벡터로 압축 → 디코더가 &lt;sos&gt;부터 &lt;eos&gt;까지 한 단어씩 생성</text>
  <text x="600" y="380" font-size="13" fill="#64748b" text-anchor="middle">훈련 시에는 정답을 디코더 입력으로 주는 교사 강요(teacher forcing)로 빠르게 학습</text>
