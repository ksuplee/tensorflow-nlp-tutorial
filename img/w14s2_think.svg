<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · "잘 했다"를 어떻게 측정할까?</text>
  <defs><marker id="t14b" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,4 L0,8 Z" fill="#2563eb"/></marker></defs>

  <!-- reference answer -->
  <rect x="60" y="120" width="250" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="185" y="150" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">정답(참조)</text>
  <text x="185" y="182" font-size="12" fill="#64748b" text-anchor="middle">"LLM으로 자연어처리</text>
  <text x="185" y="202" font-size="12" fill="#64748b" text-anchor="middle">응용이 넓어졌다."</text>
  <text x="185" y="228" font-size="11" fill="#94a3b8" text-anchor="middle">좋은 답은 여러 개일 수 있다</text>

  <!-- candidate answers, same meaning different words -->
  <g text-anchor="middle">
    <rect x="400" y="95" width="360" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="580" y="121" font-size="13" fill="#334155">"대규모 언어모델로 NLP 응용이 크게 확대됐다."</text>
    <rect x="400" y="149" width="360" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="580" y="175" font-size="13" fill="#334155">"LLM 덕분에 NLP 활용 범위가 늘었다."</text>
    <rect x="400" y="203" width="360" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="580" y="229" font-size="13" fill="#334155">"자연어처리의 응용이 확장되었다."</text>
  </g>
  <line x1="310" y1="170" x2="396" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#t14b)"/>
  <line x1="310" y1="180" x2="396" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#t14b)"/>
  <line x1="310" y1="190" x2="396" y2="222" stroke="#94a3b8" stroke-width="2" marker-end="url(#t14b)"/>

  <!-- scoring question -->
  <rect x="820" y="95" width="320" height="90" rx="12" fill="#fef9c3" stroke="#fde047"/>
  <text x="980" y="126" font-size="15" font-weight="700" fill="#854d0e" text-anchor="middle">표현은 달라도 의미는 같다</text>
  <text x="980" y="152" font-size="12" fill="#a16207" text-anchor="middle">단어 겹침만 세면 낮게 나온다</text>
  <text x="980" y="172" font-size="12" fill="#a16207" text-anchor="middle">→ 어떻게 공정히 채점할까?</text>

  <!-- social impact -->
  <rect x="820" y="200" width="320" height="60" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="980" y="228" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">게다가 편향·거짓(환각)을 답한다면?</text>
  <text x="980" y="248" font-size="12" fill="#334155" text-anchor="middle">사회에 미치는 영향은?</text>

  <text x="600" y="330" font-size="14" fill="#334155" text-anchor="middle">정답이 하나가 아닌 생성 태스크 — 의미를 반영하는 지표와 사람 평가, 그리고 사회적 책임까지 함께 살펴야 한다.</text>
</svg>
