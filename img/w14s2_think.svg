<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="350" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · LLM이 스스로 도구를 써서 여러 단계를 해낸다면?</text>
  <defs><marker id="ag14" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- task -->
  <rect x="60" y="150" width="200" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="160" y="180" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">복잡한 목표</text>
  <text x="160" y="202" font-size="11" fill="#64748b" text-anchor="middle">"A사 최근 매출 찾아 그래프로"</text>
  <line x1="260" y1="185" x2="316" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ag14)"/>
  <!-- loop -->
  <rect x="330" y="100" width="520" height="180" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="590" y="128" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">LLM 에이전트 루프</text>
  <rect x="360" y="150" width="130" height="50" rx="10" fill="#1e3a8a"/><text x="425" y="180" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">사고</text>
  <rect x="525" y="150" width="130" height="50" rx="10" fill="#2563eb"/><text x="590" y="175" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">행동(도구)</text><text x="590" y="192" font-size="10" fill="#dbeafe" text-anchor="middle">검색·계산·코드</text>
  <rect x="690" y="150" width="130" height="50" rx="10" fill="#1e3a8a"/><text x="755" y="180" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">관찰</text>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#ag14)"><line x1="490" y1="175" x2="521" y2="175"/><line x1="655" y1="175" x2="686" y2="175"/></g>
  <path d="M 755 200 C 755 240, 425 240, 425 204" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ag14)"/>
  <text x="590" y="262" font-size="12" fill="#64748b" text-anchor="middle">목표 달성까지 반복(ReAct)</text>
  <line x1="850" y1="185" x2="906" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ag14)"/>
  <!-- result + eval -->
  <rect x="920" y="120" width="220" height="60" rx="12" fill="#dcfce7" stroke="#86efac"/><text x="1030" y="147" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">결과 완성</text><text x="1030" y="167" font-size="11" fill="#166534" text-anchor="middle">여러 단계를 자율 수행</text>
  <rect x="920" y="200" width="220" height="70" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="1030" y="226" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">그런데…</text><text x="1030" y="248" font-size="11" fill="#334155" text-anchor="middle">이 '똑똑함'을 어떻게</text><text x="1030" y="264" font-size="11" fill="#334155" text-anchor="middle">공정하게 평가하지?</text>
  <text x="600" y="326" font-size="13" fill="#94a3b8" text-anchor="middle">한 번 답하고 끝이 아니라, 계획하고 도구를 쓰며 목표를 달성한다 — 그리고 그 성능을 평가한다</text>
</svg>
