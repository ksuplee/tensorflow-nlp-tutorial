<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="600" y="38" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">트랜스포머 전체 구조 (인코더–디코더)</text>
  <defs><marker id="ar10" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- encoder stack -->
  <rect x="120" y="90" width="360" height="300" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="300" y="118" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">인코더 × N (=6)</text>
  <rect x="150" y="140" width="300" height="60" rx="8" fill="#2563eb"/><text x="300" y="166" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">멀티 헤드 셀프 어텐션</text><text x="300" y="186" font-size="11" fill="#dbeafe" text-anchor="middle">Add &amp; Norm</text>
  <rect x="150" y="212" width="300" height="60" rx="8" fill="#1e3a8a"/><text x="300" y="238" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">피드 포워드(FFNN)</text><text x="300" y="258" font-size="11" fill="#dbeafe" text-anchor="middle">Add &amp; Norm</text>
  <text x="300" y="300" font-size="12" fill="#64748b" text-anchor="middle">↑ 위 블록을 6번 쌓음</text>
  <rect x="150" y="320" width="300" height="46" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="300" y="341" font-size="12" fill="#1e3a8a" text-anchor="middle">입력 임베딩 + 포지셔널 인코딩</text><text x="300" y="358" font-size="11" fill="#64748b" text-anchor="middle">"I am a student"</text>
  <!-- decoder stack -->
  <rect x="720" y="90" width="360" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="900" y="118" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">디코더 × N (=6)</text>
  <rect x="750" y="140" width="300" height="46" rx="8" fill="#2563eb"/><text x="900" y="160" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">마스크드 셀프 어텐션</text><text x="900" y="177" font-size="10" fill="#dbeafe" text-anchor="middle">Add &amp; Norm</text>
  <rect x="750" y="196" width="300" height="46" rx="8" fill="#1e3a8a"/><text x="900" y="216" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">인코더–디코더 어텐션</text><text x="900" y="233" font-size="10" fill="#dbeafe" text-anchor="middle">Add &amp; Norm</text>
  <rect x="750" y="252" width="300" height="46" rx="8" fill="#1e3a8a"/><text x="900" y="272" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">피드 포워드(FFNN)</text><text x="900" y="289" font-size="10" fill="#dbeafe" text-anchor="middle">Add &amp; Norm</text>
  <rect x="750" y="320" width="300" height="46" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="900" y="341" font-size="12" fill="#1e3a8a" text-anchor="middle">출력 임베딩 + 포지셔널 인코딩</text><text x="900" y="358" font-size="11" fill="#64748b" text-anchor="middle">"&lt;sos&gt; je suis …"</text>
  <!-- output layer -->
  <rect x="750" y="60" width="300" height="26" rx="6" fill="#16a34a"/><text x="900" y="78" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Linear + Softmax → 다음 단어</text>
  <!-- enc to dec arrow -->
  <line x1="480" y1="170" x2="746" y2="212" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ar10)"/>
  <text x="600" y="180" font-size="12" fill="#64748b" text-anchor="middle">인코더 출력(K,V)</text>
  <!-- hyperparams -->
  <rect x="120" y="405" width="960" height="46" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="600" y="433" font-size="14" fill="#334155" text-anchor="middle">주요 하이퍼파라미터: d_model=512 · num_layers=6 · num_heads=8 · d_ff=2048 · (RNN 없음 → 병렬 처리)</text>
</svg>
