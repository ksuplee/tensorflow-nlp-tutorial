<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">LSTM 셀: 셀 상태와 3개의 게이트</text>
  <defs><marker id="l6" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- cell outer -->
  <rect x="120" y="90" width="960" height="240" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- cell state conveyor (top) -->
  <line x1="140" y1="130" x2="1060" y2="130" stroke="#1e3a8a" stroke-width="4" marker-end="url(#l6)"/>
  <text x="160" y="120" font-size="14" font-weight="700" fill="#1e3a8a">셀 상태 Cₜ₋₁</text>
  <text x="990" y="120" font-size="14" font-weight="700" fill="#1e3a8a">Cₜ →</text>
  <text x="600" y="115" font-size="13" fill="#64748b" text-anchor="middle">정보를 장기적으로 실어 나르는 컨베이어 벨트</text>
  <!-- forget gate -->
  <rect x="230" y="180" width="180" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="208" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">① 망각 게이트</text>
  <text x="320" y="232" font-size="12" fill="#64748b" text-anchor="middle">σ (0~1)</text>
  <text x="320" y="258" font-size="12" fill="#334155" text-anchor="middle">이전 정보를</text>
  <text x="320" y="276" font-size="12" fill="#334155" text-anchor="middle">얼마나 잊을지</text>
  <line x1="320" y1="180" x2="320" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#l6)"/>
  <!-- input gate -->
  <rect x="480" y="180" width="180" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="570" y="208" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">② 입력 게이트</text>
  <text x="570" y="232" font-size="12" fill="#64748b" text-anchor="middle">σ × tanh</text>
  <text x="570" y="258" font-size="12" fill="#334155" text-anchor="middle">새 정보를</text>
  <text x="570" y="276" font-size="12" fill="#334155" text-anchor="middle">얼마나 저장할지</text>
  <line x1="570" y1="180" x2="570" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#l6)"/>
  <!-- output gate -->
  <rect x="730" y="180" width="180" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="820" y="208" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">③ 출력 게이트</text>
  <text x="820" y="232" font-size="12" fill="#64748b" text-anchor="middle">σ × tanh(Cₜ)</text>
  <text x="820" y="258" font-size="12" fill="#334155" text-anchor="middle">셀 상태에서</text>
  <text x="820" y="276" font-size="12" fill="#334155" text-anchor="middle">무엇을 내보낼지</text>
  <line x1="820" y1="180" x2="820" y2="134" stroke="#2563eb" stroke-width="2" marker-end="url(#l6)"/>
  <!-- hidden state out -->
  <line x1="910" y1="235" x2="1060" y2="235" stroke="#2563eb" stroke-width="3" marker-end="url(#l6)"/>
  <text x="1000" y="225" font-size="13" font-weight="700" fill="#1e3a8a">은닉 hₜ →</text>
  <!-- inputs bottom -->
  <rect x="470" y="330" width="120" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="530" y="356" font-size="13" fill="#1e3a8a" text-anchor="middle">입력 xₜ</text>
  <rect x="610" y="330" width="150" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="685" y="356" font-size="13" fill="#1e3a8a" text-anchor="middle">이전 은닉 hₜ₋₁</text>
  <line x1="590" y1="345" x2="470" y2="345" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="530" y1="330" x2="530" y2="292" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#l6)"/>
  <text x="600" y="404" font-size="14" fill="#334155" text-anchor="middle">게이트가 불필요한 기억은 지우고 중요한 기억은 오래 유지 → 장기 의존성 문제 완화</text>
</svg>
