<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="600" y="38" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">BERT의 두 가지 사전 훈련 과제</text>
  <defs><marker id="ml11" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- MLM -->
  <rect x="40" y="70" width="560" height="330" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="100" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">① 마스크드 언어 모델 (MLM)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="70" y="200" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="115" y="222" fill="#1e3a8a">my</text>
    <rect x="170" y="200" width="90" height="34" rx="6" fill="#ef4444"/><text x="215" y="222" fill="#fff">[MASK]</text>
    <rect x="270" y="200" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="315" y="222" fill="#1e3a8a">is</text>
    <rect x="370" y="200" width="90" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="415" y="222" fill="#1e3a8a">cute</text>
    <rect x="470" y="200" width="100" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="520" y="222" fill="#1e3a8a">##ing</text>
  </g>
  <rect x="150" y="130" width="130" height="40" rx="8" fill="#16a34a"/><text x="215" y="155" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">원래 단어 예측</text>
  <text x="215" y="122" font-size="12" fill="#334155" text-anchor="middle">"dog"</text>
  <line x1="215" y1="200" x2="215" y2="172" stroke="#2563eb" stroke-width="2" marker-end="url(#ml11)"/>
  <text x="320" y="268" font-size="13" fill="#334155" text-anchor="middle">전체 토큰의 <tspan font-weight="700" fill="#1e3a8a">15%</tspan>를 골라:</text>
  <g font-size="13" fill="#334155">
    <text x="70" y="300">· 80% → [MASK]로 변경</text>
    <text x="70" y="326">· 10% → 랜덤 단어로 변경</text>
    <text x="70" y="352">· 10% → 그대로 두되 예측 대상에 포함</text>
  </g>
  <text x="320" y="384" font-size="12" fill="#64748b" text-anchor="middle">단어 집합 크기의 소프트맥스로 원래 단어를 맞힘</text>
  <!-- NSP -->
  <rect x="620" y="70" width="540" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="890" y="100" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">② 다음 문장 예측 (NSP)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="646" y="140" width="70" height="34" rx="6" fill="#16a34a"/><text x="681" y="162" fill="#fff">[CLS]</text>
    <rect x="722" y="140" width="150" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="797" y="162" fill="#1e3a8a">문장 A</text>
    <rect x="878" y="140" width="70" height="34" rx="6" fill="#e2e8f0"/><text x="913" y="162" fill="#334155">[SEP]</text>
    <rect x="954" y="140" width="150" height="34" rx="6" fill="#93c5fd"/><text x="1029" y="162" fill="#1e3a8a">문장 B</text>
  </g>
  <line x1="681" y1="140" x2="681" y2="112" stroke="#2563eb" stroke-width="2" marker-end="url(#ml11)"/>
  <rect x="616" y="72" width="130" height="34" rx="8" fill="#1e3a8a"/><text x="681" y="94" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">IsNext / NotNext</text>
  <text x="890" y="210" font-size="13" fill="#334155" text-anchor="middle">두 문장이 실제로 이어지는가?</text>
  <g font-size="13" fill="#334155">
    <text x="646" y="244">· 50% 실제 이어지는 문장 → <tspan font-weight="700" fill="#16a34a">IsNext</tspan></text>
    <text x="646" y="272">· 50% 무관한 문장 → <tspan font-weight="700" fill="#ef4444">NotNext</tspan></text>
    <text x="646" y="304">· <tspan font-weight="700">[CLS]</tspan> 위치 출력으로 이진 분류</text>
  </g>
  <text x="890" y="344" font-size="13" fill="#64748b" text-anchor="middle">MLM과 NSP는 loss를 합쳐 <tspan font-weight="700" fill="#1e3a8a">동시에</tspan> 학습</text>
  <text x="890" y="372" font-size="12" fill="#94a3b8" text-anchor="middle">[SEP]로 문장 구분, [CLS]로 쌍 관계 판단</text>
</svg>
