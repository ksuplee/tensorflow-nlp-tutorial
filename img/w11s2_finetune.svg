<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="400" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">BERT 파인 튜닝의 네 가지 유형</text>
  <g>
    <rect x="40" y="80" width="270" height="290" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="40" y="80" width="270" height="46" rx="12" fill="#1e3a8a"/><text x="175" y="109" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">단일 텍스트 분류</text>
    <text x="175" y="150" font-size="13" fill="#334155" text-anchor="middle">[CLS] 출력 → 분류</text>
    <rect x="70" y="170" width="70" height="30" rx="5" fill="#16a34a"/><text x="105" y="190" font-size="11" fill="#fff" text-anchor="middle">[CLS]</text>
    <rect x="150" y="170" width="130" height="30" rx="5" fill="#dbeafe" stroke="#93c5fd"/><text x="215" y="190" font-size="11" fill="#1e3a8a" text-anchor="middle">문장</text>
    <text x="175" y="240" font-size="13" fill="#64748b" text-anchor="middle">감성 분류</text>
    <text x="175" y="262" font-size="13" fill="#64748b" text-anchor="middle">뉴스 주제 분류</text>
    <text x="175" y="340" font-size="12" fill="#94a3b8" text-anchor="middle">문장 대표 벡터 활용</text>
    <rect x="325" y="80" width="270" height="290" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="325" y="80" width="270" height="46" rx="12" fill="#2563eb"/><text x="460" y="109" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">태깅 (Tagging)</text>
    <text x="460" y="150" font-size="13" fill="#334155" text-anchor="middle">각 토큰 출력 → 태그</text>
    <g font-size="10" text-anchor="middle"><rect x="355" y="170" width="55" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/><rect x="415" y="170" width="55" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/><rect x="475" y="170" width="55" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="382" y="215" fill="#64748b">B-PER</text><text x="442" y="215" fill="#64748b">O</text><text x="502" y="215" fill="#64748b">B-LOC</text></g>
    <text x="460" y="262" font-size="13" fill="#64748b" text-anchor="middle">개체명 인식</text>
    <text x="460" y="284" font-size="13" fill="#64748b" text-anchor="middle">품사 태깅</text>
    <text x="460" y="340" font-size="12" fill="#94a3b8" text-anchor="middle">토큰별 밀집층</text>
    <rect x="610" y="80" width="270" height="290" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="610" y="80" width="270" height="46" rx="12" fill="#1e3a8a"/><text x="745" y="109" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">텍스트 쌍 분류</text>
    <text x="745" y="150" font-size="13" fill="#334155" text-anchor="middle">두 문장 관계 판단</text>
    <g font-size="10" text-anchor="middle"><rect x="640" y="170" width="45" height="28" rx="4" fill="#16a34a"/><rect x="690" y="170" width="80" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd"/><rect x="775" y="170" width="80" height="28" rx="4" fill="#93c5fd"/><text x="662" y="188" fill="#fff">CLS</text><text x="730" y="188" fill="#1e3a8a">문장A</text><text x="815" y="188" fill="#1e3a8a">문장B</text></g>
    <text x="745" y="240" font-size="13" fill="#64748b" text-anchor="middle">자연어 추론(NLI)</text>
    <text x="745" y="262" font-size="12" fill="#64748b" text-anchor="middle">함의/모순/중립</text>
    <text x="745" y="340" font-size="12" fill="#94a3b8" text-anchor="middle">분류 또는 회귀</text>
    <rect x="895" y="80" width="265" height="290" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="895" y="80" width="265" height="46" rx="12" fill="#2563eb"/><text x="1027" y="109" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">질의 응답 (QA)</text>
    <text x="1027" y="150" font-size="13" fill="#334155" text-anchor="middle">본문에서 답 추출</text>
    <text x="920" y="186" font-size="12" fill="#334155">질문 + 본문 입력</text>
    <text x="920" y="212" font-size="12" fill="#64748b">→ 답의 시작·끝 위치 예측</text>
    <text x="1027" y="256" font-size="13" fill="#64748b" text-anchor="middle">SQuAD</text>
    <text x="920" y="288" font-size="11" fill="#94a3b8">"강우 영향?" → "중력"</text>
    <text x="1027" y="340" font-size="12" fill="#94a3b8" text-anchor="middle">span 추출</text>
  </g>
</svg>
