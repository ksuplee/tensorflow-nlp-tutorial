<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 전통적 프로그래밍 vs 머신러닝</text>
  <defs>
    <marker id="t4a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <!-- traditional -->
  <rect x="50" y="70" width="500" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="300" y="100" font-size="16" font-weight="700" fill="#64748b" text-anchor="middle">전통적 프로그래밍</text>
  <rect x="80" y="130" width="150" height="46" rx="8" fill="#dbeafe"/><text x="155" y="158" font-size="14" fill="#334155" text-anchor="middle">입력(데이터)</text>
  <rect x="80" y="196" width="150" height="46" rx="8" fill="#dbeafe"/><text x="155" y="224" font-size="14" fill="#334155" text-anchor="middle">규칙(사람이 작성)</text>
  <rect x="370" y="163" width="150" height="46" rx="8" fill="#1e3a8a"/><text x="445" y="191" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">출력(정답)</text>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#t4a)">
    <line x1="230" y1="153" x2="366" y2="180"/>
    <line x1="230" y1="219" x2="366" y2="190"/>
  </g>
  <text x="300" y="292" font-size="13" fill="#94a3b8" text-anchor="middle">사람이 규칙을 직접 코딩 → "고양이 판별을 어떻게 코딩하지?"</text>
  <!-- ML -->
  <rect x="650" y="70" width="500" height="250" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="900" y="100" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">머신러닝</text>
  <rect x="680" y="130" width="150" height="46" rx="8" fill="#dbeafe"/><text x="755" y="158" font-size="14" fill="#334155" text-anchor="middle">입력(데이터)</text>
  <rect x="680" y="196" width="150" height="46" rx="8" fill="#1e3a8a"/><text x="755" y="224" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">출력(정답)</text>
  <rect x="970" y="163" width="150" height="46" rx="8" fill="#2563eb"/><text x="1045" y="185" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">규칙 f</text><text x="1045" y="202" font-size="11" fill="#dbeafe" text-anchor="middle">(모델이 학습)</text>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#t4a)">
    <line x1="830" y1="153" x2="966" y2="180"/>
    <line x1="830" y1="219" x2="966" y2="190"/>
  </g>
  <text x="900" y="292" font-size="13" fill="#64748b" text-anchor="middle">데이터(입력·정답)로부터 규칙 y=f(x)를 스스로 학습</text>
</svg>
