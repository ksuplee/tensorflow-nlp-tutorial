<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">머신러닝 개요: 학습 유형과 데이터 분할</text>

  <!-- ① learning types -->
  <rect x="60" y="66" width="1080" height="188" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="85" y="96" font-size="16" font-weight="700" fill="#1e3a8a">① 세 가지 학습 유형</text>

  <rect x="90" y="112" width="320" height="126" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="250" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">지도학습 (Supervised)</text>
  <text x="250" y="168" font-size="14" fill="#475569" text-anchor="middle">입력 + 정답(레이블)로 학습</text>
  <text x="250" y="192" font-size="13" fill="#64748b" text-anchor="middle">분류 · 회귀</text>
  <text x="250" y="220" font-size="13" fill="#2563eb" text-anchor="middle">예) 감성 분류, 스팸 판별</text>

  <rect x="440" y="112" width="320" height="126" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">비지도학습 (Unsupervised)</text>
  <text x="600" y="168" font-size="14" fill="#475569" text-anchor="middle">정답 없이 구조·패턴 발견</text>
  <text x="600" y="192" font-size="13" fill="#64748b" text-anchor="middle">군집화 · 차원 축소</text>
  <text x="600" y="220" font-size="13" fill="#2563eb" text-anchor="middle">예) 문서 군집, 토픽 모델링</text>

  <rect x="790" y="112" width="320" height="126" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="950" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">강화학습 (Reinforcement)</text>
  <text x="950" y="168" font-size="14" fill="#475569" text-anchor="middle">행동에 대한 보상으로 학습</text>
  <text x="950" y="192" font-size="13" fill="#64748b" text-anchor="middle">시행착오 · 정책 최적화</text>
  <text x="950" y="220" font-size="13" fill="#2563eb" text-anchor="middle">예) RLHF, 게임 에이전트</text>

  <!-- ② data split -->
  <rect x="60" y="270" width="1080" height="174" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="300" font-size="16" font-weight="700" fill="#1e3a8a">② 데이터 분할 — 일반화 성능을 정직하게 평가하기 위해</text>

  <!-- split bar -->
  <rect x="90" y="318" width="660" height="44" rx="6" fill="#1e3a8a"/>
  <rect x="750" y="318" width="150" height="44" rx="6" fill="#3b82f6"/>
  <rect x="900" y="318" width="210" height="44" rx="6" fill="#93c5fd"/>
  <text x="420" y="345" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">훈련(Train) 60~80%</text>
  <text x="825" y="345" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">검증(Val)</text>
  <text x="1005" y="345" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">테스트(Test)</text>

  <text x="90" y="392" font-size="14" fill="#475569">· <tspan font-weight="700" fill="#1e3a8a">훈련</tspan>: 모델 파라미터 학습    · <tspan font-weight="700" fill="#1e3a8a">검증</tspan>: 하이퍼파라미터 선택·모델 비교    · <tspan font-weight="700" fill="#1e3a8a">테스트</tspan>: 최종 일반화 성능 1회 측정</text>
  <text x="90" y="420" font-size="13" fill="#64748b">※ 테스트 데이터로 모델을 고르면 성능이 부풀려진다(정보 누수). 학습에 절대 사용하지 않는다.</text>
</svg>
