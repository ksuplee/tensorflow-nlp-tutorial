<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 원-핫 인코딩 vs 워드 임베딩</text>
  <!-- left one-hot -->
  <rect x="50" y="70" width="500" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="300" y="100" font-size="16" font-weight="700" fill="#64748b" text-anchor="middle">원-핫 인코딩</text>
  <g font-size="14" fill="#334155">
    <text x="80" y="140">사과   = [1, 0, 0, 0, 0]</text>
    <text x="80" y="170">바나나 = [0, 1, 0, 0, 0]</text>
    <text x="80" y="200">자동차 = [0, 0, 1, 0, 0]</text>
  </g>
  <text x="300" y="248" font-size="13" fill="#ef7373" text-anchor="middle">사과↔바나나 거리 = 사과↔자동차 거리</text>
  <text x="300" y="272" font-size="13" fill="#94a3b8" text-anchor="middle">모든 단어가 서로 똑같이 멀다 (유사도 없음)</text>
  <!-- right embedding -->
  <rect x="650" y="70" width="500" height="250" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="900" y="100" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">워드 임베딩 (밀집·실수)</text>
  <!-- mini 2D map -->
  <circle cx="780" cy="180" r="8" fill="#1e3a8a"/><text x="780" y="164" font-size="13" fill="#334155" text-anchor="middle">사과</text>
  <circle cx="820" cy="205" r="8" fill="#1e3a8a"/><text x="838" y="210" font-size="13" fill="#334155">바나나</text>
  <circle cx="1050" cy="270" r="8" fill="#94a3b8"/><text x="1050" y="292" font-size="13" fill="#334155" text-anchor="middle">자동차</text>
  <path d="M780 180 L820 205" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="890" y="150" font-size="13" fill="#64748b">비슷한 단어는 가깝게</text>
  <text x="900" y="308" font-size="13" fill="#1e3a8a" text-anchor="middle">각 원소가 실수 → 의미·유사도를 담는다</text>
  <text x="600" y="348" font-size="14" fill="#334155" text-anchor="middle">단어의 의미·유사도를 담으려면 표현 방식을 어떻게 바꿔야 할까?</text>
</svg>
