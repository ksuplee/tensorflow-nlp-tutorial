<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="500" fill="#ffffff"/>
  <text x="600" y="42" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">언어의 중의성(ambiguity) 4수준</text>
  <rect x="50" y="70" width="300" height="52" rx="8" fill="#1e3a8a"/><text x="200" y="103" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">수준</text>
  <rect x="350" y="70" width="800" height="52" rx="8" fill="#2563eb"/><text x="750" y="103" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">예시와 설명</text>
  <g font-size="16">
    <g><rect x="350" y="126" width="800" height="86" fill="#eff6ff"/>
      <text x="70" y="163" font-weight="700" fill="#1e3a8a">어휘적</text>
      <text x="70" y="189" font-size="13" fill="#64748b">(lexical)</text>
      <text x="368" y="163" fill="#334155">한 단어가 여러 뜻: "배"(ship / pear / belly), "눈"(eye / snow)</text>
      <text x="368" y="189" fill="#64748b" font-size="14">→ 문맥 없이는 의미를 확정할 수 없다</text></g>
    <g><rect x="350" y="214" width="800" height="86" fill="#f8fafc"/>
      <text x="70" y="251" font-weight="700" fill="#1e3a8a">구문적</text>
      <text x="70" y="277" font-size="13" fill="#64748b">(syntactic)</text>
      <text x="368" y="251" fill="#334155">"나는 망원경으로 그를 보았다" — 망원경을 든 주체가 나인가 그인가?</text>
      <text x="368" y="277" fill="#64748b" font-size="14">→ 수식 관계(구문 구조)가 둘 이상 가능</text></g>
    <g><rect x="350" y="302" width="800" height="86" fill="#eff6ff"/>
      <text x="70" y="339" font-weight="700" fill="#1e3a8a">의미적</text>
      <text x="70" y="365" font-size="13" fill="#64748b">(semantic)</text>
      <text x="368" y="339" fill="#334155">"차가 막힌다" — 도로 정체인가, 음료가 흐르지 않는가?</text>
      <text x="368" y="365" fill="#64748b" font-size="14">→ 문장 전체 의미가 상황에 따라 달라진다</text></g>
    <g><rect x="350" y="390" width="800" height="86" fill="#f8fafc"/>
      <text x="70" y="427" font-weight="700" fill="#1e3a8a">화용적</text>
      <text x="70" y="453" font-size="13" fill="#64748b">(pragmatic)</text>
      <text x="368" y="427" fill="#334155">"문 좀 닫아줄래?" — 능력을 묻는 질문이 아니라 요청</text>
      <text x="368" y="453" fill="#64748b" font-size="14">→ 발화 의도·맥락에 따라 해석이 달라진다</text></g>
  </g>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="50" y1="126" x2="1150" y2="126"/><line x1="50" y1="214" x2="1150" y2="214"/><line x1="50" y1="302" x2="1150" y2="302"/><line x1="50" y1="390" x2="1150" y2="390"/><line x1="350" y1="126" x2="350" y2="476"/></g>
</svg>
