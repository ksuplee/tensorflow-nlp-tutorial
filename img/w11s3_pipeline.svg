<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="400" fill="#ffffff"/>
  <text x="600" y="38" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">한국어 BERT 실습: 마스크 채우기 · 다음 문장 예측</text>
  <defs><marker id="pl11" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- MLM -->
  <rect x="40" y="70" width="560" height="310" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="100" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">마스크드 언어 모델 (FillMaskPipeline)</text>
  <rect x="70" y="120" width="500" height="40" rx="8" fill="#1e3a8a"/><text x="320" y="145" font-size="14" fill="#fff" text-anchor="middle">"축구는 정말 재미있는 [MASK] 다."</text>
  <line x1="320" y1="160" x2="320" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pl11)"/>
  <rect x="120" y="190" width="400" height="36" rx="8" fill="#dbeafe" stroke="#93c5fd"/><text x="320" y="213" font-size="13" fill="#1e3a8a" text-anchor="middle">TFBertForMaskedLM + FillMaskPipeline</text>
  <line x1="320" y1="226" x2="320" y2="251" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pl11)"/>
  <text x="320" y="272" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">[MASK] 상위 후보 (softmax)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="90" y="286" width="130" height="32" rx="6" fill="#16a34a"/><text x="155" y="307" fill="#fff">스포츠</text>
    <rect x="235" y="286" width="130" height="32" rx="6" fill="#2563eb"/><text x="300" y="307" fill="#fff">경기</text>
    <rect x="380" y="286" width="130" height="32" rx="6" fill="#93c5fd"/><text x="445" y="307" fill="#1e3a8a">운동</text>
  </g>
  <text x="320" y="352" font-size="12" fill="#64748b" text-anchor="middle">양방향 문맥으로 빈칸에 알맞은 단어를 추론</text>
  <!-- NSP -->
  <rect x="620" y="70" width="540" height="310" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="890" y="100" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">다음 문장 예측 (NSP)</text>
  <rect x="646" y="122" width="490" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="891" y="144" font-size="12" fill="#1e3a8a" text-anchor="middle">A: "2002년 월드컵은 …큰 잔치입니다."</text>
  <rect x="646" y="162" width="490" height="34" rx="6" fill="#93c5fd"/><text x="891" y="184" font-size="12" fill="#1e3a8a" text-anchor="middle">B: "…준비는 완벽했습니다."</text>
  <line x1="890" y1="196" x2="890" y2="220" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pl11)"/>
  <rect x="700" y="224" width="380" height="34" rx="8" fill="#1e3a8a"/><text x="890" y="246" font-size="12" fill="#fff" text-anchor="middle">TFBertForNextSentencePrediction</text>
  <line x1="890" y1="258" x2="890" y2="282" stroke="#2563eb" stroke-width="2.5" marker-end="url(#pl11)"/>
  <rect x="740" y="286" width="140" height="40" rx="8" fill="#16a34a"/><text x="810" y="311" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">IsNext (0)</text>
  <rect x="900" y="286" width="160" height="40" rx="8" fill="#e2e8f0"/><text x="980" y="311" font-size="13" fill="#334155" text-anchor="middle">NotNext (1)</text>
  <text x="890" y="352" font-size="12" fill="#64748b" text-anchor="middle">logits → softmax → 더 큰 확률의 인덱스 반환</text>
</svg>
