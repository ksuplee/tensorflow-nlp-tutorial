<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="350" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 10페이지 보고서를 세 줄로 줄이려면?</text>
  <defs><marker id="su13" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- long doc -->
  <rect x="70" y="110" width="180" height="170" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"><line x1="95" y1="140" x2="225" y2="140"/><line x1="95" y1="160" x2="225" y2="160"/><line x1="95" y1="180" x2="205" y2="180"/><line x1="95" y1="200" x2="225" y2="200"/><line x1="95" y1="220" x2="215" y2="220"/><line x1="95" y1="240" x2="225" y2="240"/></g>
  <text x="160" y="268" font-size="12" fill="#64748b" text-anchor="middle">긴 원문</text>
  <line x1="250" y1="195" x2="310" y2="195" stroke="#2563eb" stroke-width="2.5" marker-end="url(#su13)"/>
  <!-- extractive -->
  <rect x="330" y="110" width="380" height="80" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="520" y="138" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">추출 요약 (Extractive)</text>
  <text x="352" y="164" font-size="13" fill="#334155">원문에서 중요한 <tspan font-weight="700">문장을 그대로 선택</tspan></text>
  <text x="352" y="182" font-size="12" fill="#64748b">사실 왜곡 적음 · 흐름이 어색할 수 있음</text>
  <!-- abstractive -->
  <rect x="330" y="200" width="380" height="80" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="520" y="228" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">추상 요약 (Abstractive)</text>
  <text x="352" y="254" font-size="13" fill="#334155">이해 후 <tspan font-weight="700">새 문장으로 재작성(생성)</tspan></text>
  <text x="352" y="272" font-size="12" fill="#64748b">자연스러움 · 환각·사실오류 위험</text>
  <!-- dialogue -->
  <rect x="760" y="110" width="400" height="170" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="960" y="138" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">그리고 대화 시스템</text>
  <text x="784" y="168" font-size="13" fill="#334155">· 태스크 지향형: 예약·주문(의도·슬롯)</text>
  <text x="784" y="196" font-size="13" fill="#334155">· 개방형: 자유 잡담(LLM 챗봇)</text>
  <text x="784" y="230" font-size="12" fill="#64748b">맥락(이전 발화)을 유지하는 것이 핵심</text>
  <text x="784" y="258" font-size="12" fill="#94a3b8">요약·대화 모두 '생성' 태스크</text>
  <text x="600" y="326" font-size="14" fill="#334155" text-anchor="middle">핵심만 남기거나 자연스럽게 대답하려면, 문장을 '고르거나' '새로 쓰는' 두 길이 있다</text>
</svg>
