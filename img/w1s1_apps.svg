    </g>
    <text x="347" y="300" font-size="13" fill="#64748b">seq2seq·트랜스포머로</text>
    <text x="347" y="322" font-size="13" fill="#64748b">자연스러운 번역 실현</text>
  </g>
  <g>
    <rect x="610" y="80" width="270" height="330" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="610" y="80" width="270" height="52" rx="12" fill="#1e3a8a"/>
    <text x="745" y="113" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">대화 시스템</text>
    <g font-size="15" fill="#334155">
      <text x="632" y="164">· 고객 서비스 챗봇</text>
      <text x="632" y="196">· 가상 비서(Siri 등)</text>
      <text x="632" y="228">· 헬스케어 상담</text>
