<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="600" y="42" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">자연어처리의 대표 응용 분야</text>
  <g>
    <rect x="40" y="80" width="270" height="330" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="40" y="80" width="270" height="52" rx="12" fill="#1e3a8a"/>
    <text x="175" y="113" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">텍스트 분류·요약</text>
    <g font-size="15" fill="#334155">
      <text x="62" y="164">· 스팸 필터링</text>
      <text x="62" y="196">· 감성 분석(긍/부정)</text>
      <text x="62" y="228">· 주제 분류·언어 식별</text>
      <text x="62" y="260">· 추출적/추상적 요약</text>
    </g>
    <text x="62" y="300" font-size="13" fill="#64748b">뉴스·논문·리뷰를</text>
    <text x="62" y="322" font-size="13" fill="#64748b">범주화하거나 압축</text>
  </g>
  <g>
    <rect x="325" y="80" width="270" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="325" y="80" width="270" height="52" rx="12" fill="#2563eb"/>
    <text x="460" y="113" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">기계번역</text>
