<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="360" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 긴 문서를 다 읽지 않고, 원하는 정보만 골라내거나 요약할 수 있을까?</text>
  <defs><marker id="t14a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,4 L0,8 Z" fill="#2563eb"/></marker></defs>

  <!-- long document -->
  <rect x="60" y="100" width="230" height="185" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="175" y="128" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">긴 비정형 텍스트</text>
  <g stroke="#cbd5e1" stroke-width="8" stroke-linecap="round">
    <line x1="90" y1="150" x2="260" y2="150"/><line x1="90" y1="172" x2="260" y2="172"/>
    <line x1="90" y1="194" x2="260" y2="194"/><line x1="90" y1="216" x2="230" y2="216"/>
    <line x1="90" y1="238" x2="260" y2="238"/><line x1="90" y1="260" x2="200" y2="260"/>
  </g>

  <!-- 4 application outcomes -->
  <g text-anchor="middle">
    <rect x="470" y="90" width="310" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="500" y="122" font-size="20">🔎</text><text x="640" y="115" font-size="14" font-weight="700" fill="#1e3a8a">정보 추출</text><text x="640" y="133" font-size="11" fill="#64748b">누가·언제·무엇을 (개체·관계)</text>

    <rect x="470" y="152" width="310" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="500" y="184" font-size="20">❓</text><text x="640" y="177" font-size="14" font-weight="700" fill="#1e3a8a">질의응답 (QA)</text><text x="640" y="195" font-size="11" fill="#64748b">"이 문서의 핵심은?"에 바로 답</text>

    <rect x="470" y="214" width="310" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="500" y="246" font-size="20">📝</text><text x="640" y="239" font-size="14" font-weight="700" fill="#1e3a8a">문서 요약</text><text x="640" y="257" font-size="11" fill="#64748b">"세 줄로 요약해줘"</text>

    <rect x="820" y="152" width="310" height="52" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="850" y="184" font-size="20">💬</text><text x="985" y="177" font-size="14" font-weight="700" fill="#166534">대화 (챗봇)</text><text x="985" y="195" font-size="11" fill="#64748b">맥락을 이어가며 자연스레 응답</text>
  </g>

  <line x1="292" y1="150" x2="466" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#t14a)"/>
  <line x1="292" y1="190" x2="466" y2="182" stroke="#94a3b8" stroke-width="2" marker-end="url(#t14a)"/>
  <line x1="292" y1="230" x2="466" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#t14a)"/>
  <line x1="782" y1="180" x2="816" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#t14a)"/>

  <text x="600" y="330" font-size="14" fill="#334155" text-anchor="middle">방대한 텍스트에서 필요한 정보만 뽑고·묻고·요약하고·대화하는 것 — 이것이 NLP 응용의 세계다.</text>
</svg>
