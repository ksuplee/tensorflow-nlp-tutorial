<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="380" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 단어를 벡터 공간에 놓으면 무엇이 보일까?</text>
  <!-- plot area -->
  <rect x="330" y="70" width="520" height="270" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g stroke="#334155" stroke-width="1.8"><line x1="380" y1="310" x2="810" y2="310"/><line x1="380" y1="310" x2="380" y2="95"/></g>
  <!-- points -->
  <circle cx="700" cy="140" r="8" fill="#1e3a8a"/><text x="715" y="138" font-size="15" font-weight="700" fill="#1e3a8a">king</text>
  <circle cx="640" cy="160" r="8" fill="#2563eb"/><text x="560" y="158" font-size="15" font-weight="700" fill="#2563eb" text-anchor="end">queen</text>
  <circle cx="540" cy="235" r="8" fill="#1e3a8a"/><text x="555" y="233" font-size="15" font-weight="700" fill="#1e3a8a">prince</text>
  <circle cx="480" cy="255" r="8" fill="#2563eb"/><text x="470" y="278" font-size="15" font-weight="700" fill="#2563eb" text-anchor="end">princess</text>
  <!-- gender direction arrows -->
  <line x1="700" y1="140" x2="640" y2="160" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="540" y1="235" x2="480" y2="255" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="600" y="300" font-size="12" fill="#ef4444" text-anchor="middle">남→여 방향이 평행</text>
  <!-- note -->
  <rect x="880" y="110" width="280" height="190" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1020" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">벡터 공간의 의미</text>
  <g font-size="14" fill="#334155">
    <text x="902" y="174">· 비슷한 단어는 가까이 위치</text>
    <text x="902" y="204">· 좌표로 유사도 계산 가능</text>
    <text x="902" y="234">· 방향이 의미를 담음</text>
    <text x="920" y="260" font-size="13" fill="#64748b">(왕↔여왕 = 왕자↔공주)</text>
  </g>
  <text x="600" y="366" font-size="14" fill="#334155" text-anchor="middle">단어를 저차원 실수 벡터로 표현하면 의미와 유사도가 기하학적으로 드러난다</text>
</svg>
