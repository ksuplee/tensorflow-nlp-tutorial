<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="340" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 기계번역은 어떻게 발전해 왔을까?</text>
  <defs><marker id="mt9" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <g>
    <rect x="40" y="110" width="250" height="140" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="165" y="140" font-size="16" font-weight="700" fill="#64748b" text-anchor="middle">RBMT</text>
    <text x="165" y="166" font-size="13" fill="#334155" text-anchor="middle">규칙 기반</text>
    <text x="165" y="192" font-size="12" fill="#64748b" text-anchor="middle">언어학 규칙·사전</text>
    <text x="165" y="222" font-size="12" fill="#94a3b8" text-anchor="middle">규칙 작성 부담↑</text>
    <rect x="320" y="110" width="250" height="140" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="445" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">SMT</text>
    <text x="445" y="166" font-size="13" fill="#334155" text-anchor="middle">통계 기반</text>
    <text x="445" y="192" font-size="12" fill="#64748b" text-anchor="middle">병렬 코퍼스 확률</text>
    <text x="445" y="222" font-size="12" fill="#94a3b8" text-anchor="middle">모듈의 결합</text>
    <rect x="620" y="110" width="250" height="140" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="745" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">NMT</text>
    <text x="745" y="166" font-size="13" fill="#334155" text-anchor="middle">신경망 기반</text>
    <text x="745" y="192" font-size="12" fill="#64748b" text-anchor="middle">End-to-End(seq2seq)</text>
    <text x="745" y="222" font-size="12" fill="#94a3b8" text-anchor="middle">워드 임베딩 활용</text>
    <rect x="920" y="110" width="250" height="140" rx="12" fill="#1e3a8a"/>
    <text x="1045" y="140" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">NMT + Attention</text>
    <text x="1045" y="166" font-size="13" fill="#dbeafe" text-anchor="middle">어텐션·트랜스포머</text>
    <text x="1045" y="192" font-size="12" fill="#dbeafe" text-anchor="middle">긴 문장에 강함</text>
    <text x="1045" y="222" font-size="12" fill="#93c5fd" text-anchor="middle">현재 주류</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#mt9)">
    <line x1="290" y1="180" x2="316" y2="180"/><line x1="570" y1="180" x2="616" y2="180"/><line x1="870" y1="180" x2="916" y2="180"/>
  </g>
  <text x="600" y="300" font-size="14" fill="#334155" text-anchor="middle">규칙 → 통계 → 신경망으로 발전 — 이번 주는 신경망 번역(seq2seq)과 어텐션을 배운다</text>
</svg>
