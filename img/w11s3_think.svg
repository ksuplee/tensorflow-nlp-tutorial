<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="320" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 사전학습된 한국어 BERT를 바로 써볼 수 있을까?</text>
  <defs><marker id="tk11" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <g>
    <rect x="80" y="110" width="240" height="90" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="200" y="142" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">transformers 패키지</text>
    <text x="200" y="168" font-size="12" fill="#64748b" text-anchor="middle">Hugging Face</text>
    <text x="200" y="188" font-size="11" fill="#94a3b8" text-anchor="middle">pip install transformers</text>
    <rect x="400" y="110" width="240" height="90" rx="10" fill="#1e3a8a"/>
    <text x="520" y="142" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">klue/bert-base</text>
    <text x="520" y="168" font-size="12" fill="#dbeafe" text-anchor="middle">사전학습 한국어 BERT</text>
    <text x="520" y="188" font-size="11" fill="#93c5fd" text-anchor="middle">from_pretrained(...)</text>
    <rect x="720" y="110" width="400" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="920" y="142" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">모델 ↔ 토크나이저 (항상 쌍)</text>
    <text x="920" y="168" font-size="12" fill="#64748b" text-anchor="middle">단어 ↔ 정수 인코딩 매핑을 맞춰야 함</text>
    <text x="920" y="188" font-size="11" fill="#94a3b8" text-anchor="middle">AutoTokenizer.from_pretrained("klue/bert-base")</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#tk11)"><line x1="320" y1="155" x2="396" y2="155"/><line x1="640" y1="155" x2="716" y2="155"/></g>
  <text x="600" y="250" font-size="14" fill="#334155" text-anchor="middle">사전학습 모델을 내려받아 마스크 채우기·다음 문장 예측을 몇 줄로 실행할 수 있다</text>
  <text x="600" y="284" font-size="13" fill="#64748b" text-anchor="middle">모델과 토크나이저는 반드시 같은 이름으로 로드해 매핑 관계를 유지한다</text>
</svg>
