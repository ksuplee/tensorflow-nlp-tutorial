<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="470" viewBox="0 0 1250 470" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1250" height="470" fill="#ffffff"/>
  <text x="625" y="38" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">검색증강생성(RAG) 파이프라인</text>
  <defs><marker id="r1" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="r2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#64748b"/></marker></defs>
  <!-- 인덱싱 단계 -->
  <rect x="30" y="66" width="1190" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="94" font-size="16" font-weight="700" fill="#64748b">① 인덱싱 (오프라인)</text>
  <g text-anchor="middle" font-size="14">
    <rect x="70" y="110" width="180" height="70" rx="10" fill="#e2e8f0"/><text x="160" y="140" fill="#334155" font-weight="700">문서 모음</text><text x="160" y="162" fill="#64748b" font-size="12">(지식 베이스)</text>
    <rect x="330" y="110" width="180" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="420" y="140" fill="#1e3a8a" font-weight="700">청킹(Chunking)</text><text x="420" y="162" fill="#64748b" font-size="12">문서를 조각으로 분할</text>
    <rect x="590" y="110" width="180" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="680" y="140" fill="#1e3a8a" font-weight="700">임베딩</text><text x="680" y="162" fill="#64748b" font-size="12">벡터로 변환</text>
    <rect x="850" y="110" width="200" height="70" rx="10" fill="#1e3a8a"/><text x="950" y="140" fill="#fff" font-weight="700">벡터 데이터베이스</text><text x="950" y="162" fill="#c7d2fe" font-size="12">(FAISS, Chroma 등)</text>
  </g>
  <g stroke="#64748b" stroke-width="2"><line x1="250" y1="145" x2="326" y2="145" marker-end="url(#r2)"/><line x1="510" y1="145" x2="586" y2="145" marker-end="url(#r2)"/><line x1="770" y1="145" x2="846" y2="145" marker-end="url(#r2)"/></g>
  <!-- 질의 단계 -->
  <rect x="30" y="240" width="1190" height="200" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="55" y="268" font-size="16" font-weight="700" fill="#1e3a8a">② 검색·생성 (온라인)</text>
  <g text-anchor="middle" font-size="14">
    <rect x="70" y="290" width="170" height="66" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="155" y="320" fill="#1e3a8a" font-weight="700">질문</text><text x="155" y="342" fill="#64748b" font-size="12">사용자 질의</text>
    <rect x="300" y="290" width="170" height="66" rx="10" fill="#fff" stroke="#93c5fd"/><text x="385" y="320" fill="#334155" font-weight="700">질문 임베딩</text><text x="385" y="342" fill="#64748b" font-size="12">벡터로 변환</text>
    <rect x="530" y="290" width="200" height="66" rx="10" fill="#fff" stroke="#93c5fd"/><text x="630" y="316" fill="#334155" font-weight="700">유사도 검색</text><text x="630" y="338" fill="#64748b" font-size="12">관련 문서 top-k 추출</text>
    <rect x="790" y="290" width="190" height="66" rx="10" fill="#fff" stroke="#93c5fd"/><text x="885" y="316" fill="#334155" font-weight="700">프롬프트 결합</text><text x="885" y="338" fill="#64748b" font-size="12">질문+검색문서</text>
    <rect x="1040" y="290" width="150" height="66" rx="10" fill="#1e3a8a"/><text x="1115" y="320" fill="#fff" font-weight="700">LLM</text><text x="1115" y="342" fill="#c7d2fe" font-size="12">답변 생성</text>
    <rect x="470" y="386" width="450" height="40" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="695" y="412" fill="#15803d" font-weight="700">근거 문서에 기반한 답변 (출처 제시 가능)</text>
  </g>
  <g stroke="#2563eb" stroke-width="2"><line x1="240" y1="323" x2="296" y2="323" marker-end="url(#r1)"/><line x1="470" y1="323" x2="526" y2="323" marker-end="url(#r1)"/><line x1="730" y1="323" x2="786" y2="323" marker-end="url(#r1)"/><line x1="980" y1="323" x2="1036" y2="323" marker-end="url(#r1)"/></g>
  <line x1="950" y1="182" x2="630" y2="286" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r2)"/>
  <text x="1115" y="380" font-size="12" fill="#64748b" text-anchor="middle">↓</text>
  <line x1="1115" y1="358" x2="900" y2="386" stroke="#2563eb" stroke-width="2" marker-end="url(#r1)"/>
</svg>
