<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="380" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">희소 표현(원-핫) vs 밀집 표현(임베딩)</text>
  <!-- left one-hot -->
  <rect x="40" y="70" width="540" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="70" width="540" height="46" rx="12" fill="#64748b"/>
  <text x="310" y="100" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">원-핫 (희소·Sparse)</text>
  <text x="66" y="150" font-size="15" fill="#334155">"바나나" = [0,0,0,0,1,0,0, … ,0]</text>
  <g font-size="14">
    <rect x="66" y="170" width="26" height="26" fill="#e2e8f0"/><rect x="94" y="170" width="26" height="26" fill="#e2e8f0"/><rect x="122" y="170" width="26" height="26" fill="#e2e8f0"/><rect x="150" y="170" width="26" height="26" fill="#e2e8f0"/><rect x="178" y="170" width="26" height="26" fill="#1e3a8a"/><rect x="206" y="170" width="26" height="26" fill="#e2e8f0"/><rect x="234" y="170" width="26" height="26" fill="#e2e8f0"/><text x="270" y="188" fill="#64748b">… (10,000 차원)</text>
  </g>
  <text x="66" y="240" font-size="14" fill="#334155">· 어휘 크기 = 벡터 차원 (매우 큼)</text>
  <text x="66" y="270" font-size="14" fill="#334155">· 단 하나만 1, 나머지 0</text>
  <text x="66" y="300" font-size="14" fill="#ef4444">· 단어 간 유사도 = 항상 0 (의미 없음)</text>
  <!-- right embedding -->
  <rect x="620" y="70" width="540" height="280" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="620" y="70" width="540" height="46" rx="12" fill="#1e3a8a"/>
  <text x="890" y="100" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">임베딩 (밀집·Dense)</text>
  <text x="646" y="150" font-size="15" fill="#334155">"바나나" = [1.2, 0.8, 1.5, 2.1, 3.8]</text>
  <g font-size="12">
    <rect x="646" y="170" width="60" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="676" y="188" fill="#1e3a8a" text-anchor="middle">1.2</text>
    <rect x="710" y="170" width="60" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="740" y="188" fill="#1e3a8a" text-anchor="middle">0.8</text>
    <rect x="774" y="170" width="60" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="804" y="188" fill="#1e3a8a" text-anchor="middle">1.5</text>
    <rect x="838" y="170" width="60" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="868" y="188" fill="#1e3a8a" text-anchor="middle">2.1</text>
    <rect x="902" y="170" width="60" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="932" y="188" fill="#1e3a8a" text-anchor="middle">3.8</text>
    <text x="980" y="188" fill="#64748b">(예: 100~300 차원)</text>
  </g>
  <text x="646" y="240" font-size="14" fill="#334155">· 저차원 실수 벡터 (밀집)</text>
  <text x="646" y="270" font-size="14" fill="#334155">· 의미를 여러 차원에 분산 표현</text>
  <text x="646" y="300" font-size="14" fill="#16a34a">· "선생님" ↔ "교사"가 "전화기"보다 가까움</text>
</svg>
