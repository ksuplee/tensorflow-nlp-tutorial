<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="400" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">합성곱 연산과 풀링</text>
  <defs><marker id="cv8" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- input grid -->
  <text x="180" y="90" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">입력 (특징 맵)</text>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <rect x="80" y="105" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/><rect x="130" y="105" width="50" height="50" fill="#dbeafe" stroke="#60a5fa"/><rect x="180" y="105" width="50" height="50" fill="#dbeafe" stroke="#60a5fa"/><rect x="230" y="105" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="80" y="155" width="50" height="50" fill="#dbeafe" stroke="#60a5fa"/><rect x="130" y="155" width="50" height="50" fill="#dbeafe" stroke="#60a5fa"/><rect x="180" y="155" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/><rect x="230" y="155" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="80" y="205" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/><rect x="130" y="205" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/><rect x="180" y="205" width="50" height="50" fill="#dbeafe" stroke="#60a5fa"/><rect x="230" y="205" width="50" height="50" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="80" y="255" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/><rect x="130" y="255" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/><rect x="180" y="255" width="50" height="50" fill="#eff6ff" stroke="#bfdbfe"/><rect x="230" y="255" width="50" height="50" fill="#dbeafe" stroke="#60a5fa"/>
  </g>
  <!-- kernel highlight -->
  <rect x="80" y="105" width="100" height="100" fill="none" stroke="#ef4444" stroke-width="3"/>
  <text x="130" y="330" font-size="13" fill="#ef4444" text-anchor="middle">커널(필터)이 스캔</text>
  <!-- arrow -->
  <line x1="300" y1="205" x2="360" y2="205" stroke="#2563eb" stroke-width="2.5" marker-end="url(#cv8)"/>
  <text x="330" y="195" font-size="12" fill="#64748b" text-anchor="middle">합성곱</text>
  <!-- feature map -->
  <text x="470" y="90" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">특성 맵</text>
  <g>
    <rect x="400" y="130" width="46" height="46" fill="#1e3a8a"/><rect x="446" y="130" width="46" height="46" fill="#2563eb"/><rect x="492" y="130" width="46" height="46" fill="#2563eb"/>
    <rect x="400" y="176" width="46" height="46" fill="#2563eb"/><rect x="446" y="176" width="46" height="46" fill="#1e3a8a"/><rect x="492" y="176" width="46" height="46" fill="#2563eb"/>
    <rect x="400" y="222" width="46" height="46" fill="#2563eb"/><rect x="446" y="222" width="46" height="46" fill="#2563eb"/><rect x="492" y="222" width="46" height="46" fill="#1e3a8a"/>
  </g>
  <text x="470" y="300" font-size="12" fill="#64748b" text-anchor="middle">= 커널·입력 곱의 합</text>
  <!-- arrow2 -->
  <line x1="560" y1="200" x2="620" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#cv8)"/>
  <text x="590" y="190" font-size="12" fill="#64748b" text-anchor="middle">풀링</text>
  <!-- pooled -->
  <text x="700" y="90" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">풀링 결과</text>
  <g>
    <rect x="660" y="150" width="50" height="50" fill="#1e3a8a"/><rect x="710" y="150" width="50" height="50" fill="#2563eb"/>
    <rect x="660" y="200" width="50" height="50" fill="#2563eb"/><rect x="710" y="200" width="50" height="50" fill="#1e3a8a"/>
  </g>
  <text x="710" y="285" font-size="12" fill="#64748b" text-anchor="middle">최대/평균 풀링 → 계산량↓</text>
  <!-- right note -->
  <rect x="810" y="110" width="350" height="200" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="985" y="140" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">CNN 핵심 구성</text>
  <g font-size="14" fill="#334155">
    <text x="832" y="174">· 합성곱 층: 커널로 특징 추출</text>
    <text x="832" y="204">· 활성화(ReLU): 비선형성</text>
    <text x="832" y="234">· 풀링 층: 요약·계산량 감소</text>
    <text x="832" y="264">· 완전연결 층: 최종 예측</text>
    <text x="832" y="294" font-size="12" fill="#64748b">공간·순서 구조를 보존해 학습</text>
  </g>
</svg>
