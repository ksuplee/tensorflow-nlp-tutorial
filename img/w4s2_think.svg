<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="380" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 두 클래스를 나누는 최적의 선은?</text>
  <!-- plot area -->
  <rect x="360" y="70" width="480" height="270" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g stroke="#cbd5e1" stroke-width="1.5"><line x1="390" y1="315" x2="810" y2="315"/><line x1="390" y1="315" x2="390" y2="95"/></g>
  <!-- decision boundary (green line) -->
  <line x1="410" y1="320" x2="800" y2="120" stroke="#16a34a" stroke-width="3.5"/>
  <text x="720" y="150" font-size="14" fill="#16a34a" font-weight="700">결정 경계</text>
  <!-- red class (lower-right) -->
  <g fill="#ef4444">
    <circle cx="560" cy="285" r="7"/><circle cx="620" cy="270" r="7"/><circle cx="640" cy="300" r="7"/>
    <circle cx="700" cy="265" r="7"/><circle cx="720" cy="295" r="7"/><circle cx="760" cy="275" r="7"/>
  </g>
  <!-- blue class (upper-left) -->
  <g fill="#2563eb">
    <circle cx="430" cy="180" r="7"/><circle cx="470" cy="150" r="7"/><circle cx="450" cy="220" r="7"/>
    <circle cx="510" cy="175" r="7"/><circle cx="530" cy="140" r="7"/><circle cx="490" cy="240" r="7"/>
  </g>
  <text x="600" y="366" font-size="0"> </text>
  <!-- legend / note -->
  <rect x="880" y="120" width="280" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="905" cy="155" r="7" fill="#2563eb"/><text x="920" y="160" font-size="14" fill="#334155">클래스 A (예: 합격)</text>
  <circle cx="905" cy="188" r="7" fill="#ef4444"/><text x="920" y="193" font-size="14" fill="#334155">클래스 B (예: 불합격)</text>
  <line x1="895" y1="218" x2="915" y2="218" stroke="#16a34a" stroke-width="3.5"/><text x="925" y="223" font-size="14" fill="#334155">로지스틱 결정 경계</text>
  <text x="900" y="252" font-size="12" fill="#64748b">경계 위=1, 아래=0으로 분류</text>
  <text x="600" y="368" font-size="14" fill="#334155" text-anchor="middle">로지스틱 회귀는 두 클래스를 가르는 "최적의 경계"를 학습한다</text>
</svg>
