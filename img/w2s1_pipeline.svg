<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="300" viewBox="0 0 1300 300" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1300" height="300" fill="#ffffff"/>
  <text x="650" y="42" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">텍스트 전처리 파이프라인</text>
  <defs><marker id="pp" markerWidth="13" markerHeight="13" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker></defs>
  <g text-anchor="middle">
    <rect x="30" y="110" width="180" height="90" rx="12" fill="#1e3a8a"/><text x="120" y="150" font-size="17" font-weight="700" fill="#fff">원문</text><text x="120" y="176" font-size="12" fill="#c7d2fe">raw text</text>
    <rect x="252" y="110" width="190" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="347" y="145" font-size="16" font-weight="700" fill="#1e3a8a">정규화</text><text x="347" y="170" font-size="11.5" fill="#475569">소문자·유니코드</text><text x="347" y="188" font-size="11.5" fill="#475569">노이즈 제거</text>
    <rect x="484" y="110" width="190" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="579" y="145" font-size="16" font-weight="700" fill="#1e3a8a">토큰화</text><text x="579" y="170" font-size="11.5" fill="#475569">단어·형태소·</text><text x="579" y="188" font-size="11.5" fill="#475569">부분단어 분리</text>
    <rect x="716" y="110" width="190" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="811" y="145" font-size="16" font-weight="700" fill="#1e3a8a">불용어 제거</text><text x="811" y="170" font-size="11.5" fill="#475569">의미 적은 단어</text><text x="811" y="188" font-size="11.5" fill="#475569">(조사·관사 등)</text>
    <rect x="948" y="110" width="190" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="1043" y="145" font-size="16" font-weight="700" fill="#1e3a8a">정규화(어형)</text><text x="1043" y="170" font-size="11.5" fill="#475569">어간·표제어</text><text x="1043" y="188" font-size="11.5" fill="#475569">추출</text>
    <rect x="1180" y="110" width="110" height="90" rx="12" fill="#2563eb"/><text x="1235" y="150" font-size="15" font-weight="700" fill="#fff">토큰 열</text><text x="1235" y="174" font-size="11" fill="#dbeafe">→ 모델 입력</text>
  </g>
  <g stroke="#2563eb" stroke-width="2.5">
    <line x1="212" y1="155" x2="248" y2="155" marker-end="url(#pp)"/>
    <line x1="444" y1="155" x2="480" y2="155" marker-end="url(#pp)"/>
    <line x1="676" y1="155" x2="712" y2="155" marker-end="url(#pp)"/>
    <line x1="908" y1="155" x2="944" y2="155" marker-end="url(#pp)"/>
    <line x1="1140" y1="155" x2="1176" y2="155" marker-end="url(#pp)"/>
  </g>
  <text x="650" y="252" font-size="15" fill="#64748b" text-anchor="middle">※ 순서·구성은 태스크에 따라 달라진다. 불용어 제거·어간 추출은 생략하기도 하며, 신경망 모델에서는 부분단어 토큰화가 주로 쓰인다.</text>
</svg>
