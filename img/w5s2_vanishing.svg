<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="400" fill="#ffffff"/>
  <text x="600" y="40" font-size="23" font-weight="700" fill="#1e3a8a" text-anchor="middle">기울기 소실·폭주와 대응</text>
  <defs>
    <marker id="v5" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
  <!-- left: gradient shrinking -->
  <rect x="40" y="70" width="560" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="320" y="100" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">역전파 중 기울기가 작아짐(소실)</text>
  <g>
    <rect x="470" y="140" width="90" height="150" rx="8" fill="#1e3a8a"/><text x="515" y="315" font-size="12" fill="#64748b" text-anchor="middle">출력층</text>
    <rect x="350" y="180" width="90" height="110" rx="8" fill="#2563eb"/><text x="395" y="315" font-size="12" fill="#64748b" text-anchor="middle">은닉층</text>
    <rect x="230" y="220" width="90" height="70" rx="8" fill="#60a5fa"/><text x="275" y="315" font-size="12" fill="#64748b" text-anchor="middle">은닉층</text>
    <rect x="110" y="255" width="90" height="35" rx="8" fill="#bfdbfe"/><text x="155" y="315" font-size="12" fill="#64748b" text-anchor="middle">입력층</text>
  </g>
  <line x1="500" y1="130" x2="150" y2="130" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#v5)"/>
  <text x="330" y="122" font-size="12" fill="#ef4444" text-anchor="middle">기울기가 입력층으로 갈수록 0에 수렴</text>
  <text x="320" y="348" font-size="13" fill="#64748b" text-anchor="middle">시그모이드 양 끝 기울기≈0이 원인 · 반대로 커지면 폭주(RNN에서 빈번)</text>
  <!-- right: remedies -->
  <rect x="620" y="70" width="540" height="300" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="890" y="100" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">대응 방법</text>
  <g font-size="14" fill="#334155">
    <text x="645" y="140">· <tspan font-weight="700" fill="#1e3a8a">ReLU·Leaky ReLU</tspan> — 기울기 소실 완화</text>
    <text x="645" y="176">· <tspan font-weight="700" fill="#1e3a8a">가중치 초기화</tspan> — Xavier(S자형), He(ReLU)</text>
    <text x="645" y="212">· <tspan font-weight="700" fill="#1e3a8a">그래디언트 클리핑</tspan> — 폭주 방지(RNN)</text>
    <text x="645" y="248">· <tspan font-weight="700" fill="#1e3a8a">배치 정규화</tspan> — 층 입력 분포 안정화</text>
    <text x="645" y="284">· <tspan font-weight="700" fill="#1e3a8a">층 정규화</tspan> — 시점별 통계, RNN·트랜스포머</text>
  </g>
  <text x="890" y="332" font-size="13" fill="#64748b" text-anchor="middle">활성화 함수·초기화·정규화의 조합으로</text>
  <text x="890" y="352" font-size="13" fill="#64748b" text-anchor="middle">깊은 신경망도 안정적으로 학습</text>
</svg>
