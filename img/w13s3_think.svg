<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="1200" height="340" fill="#ffffff"/>
  <text x="600" y="40" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">생각해보기 · 사전학습 모델을 몇 줄로 불러 응용을 만들려면?</text>
  <defs><marker id="im13" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <!-- pipeline -->
  <rect x="440" y="90" width="320" height="70" rx="12" fill="#1e3a8a"/>
  <text x="600" y="120" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Hugging Face pipeline</text>
  <text x="600" y="144" font-size="12" fill="#dbeafe" text-anchor="middle">사전학습 모델을 몇 줄로 사용</text>
  <!-- two branches -->
  <rect x="120" y="210" width="440" height="100" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="340" y="238" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">추출형 (BERT 계열)</text>
  <text x="142" y="266" font-size="13" fill="#334155">지문에서 정답 구간을 찾음</text>
  <text x="142" y="290" font-size="12" fill="#64748b">근거가 명확 · 지문에 답이 있어야 함</text>
  <rect x="640" y="210" width="440" height="100" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="860" y="238" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">생성형 (LLM)</text>
  <text x="662" y="266" font-size="13" fill="#334155">답을 문장으로 생성</text>
  <text x="662" y="290" font-size="12" fill="#64748b">유연·자연스러움 · 환각 위험(검증 필요)</text>
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#im13)"><line x1="520" y1="160" x2="360" y2="206"/><line x1="680" y1="160" x2="840" y2="206"/></g>
  <text x="600" y="196" font-size="12" fill="#64748b" text-anchor="middle">같은 입력에 두 방식을 적용해 비교</text>
  <text x="600" y="330" font-size="13" fill="#94a3b8" text-anchor="middle">결과는 ROUGE·EM/F1 같은 지표와 오류 분석으로 평가한다</text>
</svg>
